<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — FraudShield</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<div class="auth-bg">
  <div class="auth-grid-pattern"></div>
  <div style="position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,0.12),transparent 70%);top:-120px;right:-100px;pointer-events:none;"></div>
  <div style="position:absolute;width:350px;height:350px;border-radius:50%;background:radial-gradient(circle,rgba(16,163,74,0.08),transparent 70%);bottom:-80px;left:-80px;pointer-events:none;"></div>
  <div class="auth-card" style="max-width:480px;">
    <!-- Brand -->
    <div class="flex flex-col items-center mb-6">
      <div class="brand-badge mb-3">
        <svg class="shield-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.25 3.75 10.15 9 11.35C17.25 21.15 21 16.25 21 11V5l-9-4zm0 4l5 2.18V11c0 3.32-2.25 6.43-5 7.43C9.25 17.43 7 14.32 7 11V7.18L12 5z"/>
        </svg>
        FraudShield
      </div>
      <h1 class="text-2xl font-bold text-slate-900 mb-1">Create an account</h1>
      <p class="text-sm text-slate-500">Start detecting fraud in seconds</p>
    </div>
    {% if error %}
    <div class="alert alert-error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      {{ error }}
    </div>
    {% endif %}
    <form action="/register" method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <div style="position:relative;">
          <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#94a3b8;" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
          <input type="text" name="username" class="form-input" placeholder="Choose a username" style="padding-left:38px;" required/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#94a3b8;" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
          <input type="password" name="password" id="reg-password" class="form-input" placeholder="Create a strong password" style="padding-left:38px;" required/>
          <button type="button" onclick="toggleRegPass()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;width:auto;color:#94a3b8;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
        <!-- Password strength indicator -->
        <div id="strength-bar" style="height:4px;border-radius:999px;background:#e2e8f0;margin-top:6px;overflow:hidden;">
          <div id="strength-fill" style="height:100%;width:0;border-radius:999px;transition:width 0.3s,background 0.3s;"></div>
        </div>
        <p id="strength-label" class="text-xs mt-1" style="color:#94a3b8;"></p>
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select name="role" class="form-input form-select" required>
          <option value="" disabled selected>Select your role</option>
          <option value="admin">Admin</option>
          <option value="user">User</option>
        </select>
      </div>
      <!-- Terms checkbox -->
      <label class="flex items-start gap-3 mb-4 cursor-pointer">
        <input type="checkbox" required class="mt-1 rounded" style="accent-color:var(--brand);width:16px;height:16px;flex-shrink:0;"/>
        <span class="text-sm text-slate-500">I agree to the <a href="#" style="color:var(--brand);font-weight:600;">Terms of Service</a> and <a href="#" style="color:var(--brand);font-weight:600;">Privacy Policy</a></span>
      </label>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>
    <div class="divider">already registered?</div>
    <p class="text-center text-sm text-slate-500">
      Have an account?
      <a href="/login" class="font-semibold" style="color:var(--brand);">Sign in instead</a>
    </p>
  </div>
</div>
<script>
function toggleRegPass() {
  const p = document.getElementById('reg-password');
  p.type = p.type === 'password' ? 'text' : 'password';
}
document.getElementById('reg-password').addEventListener('input', function() {
  const val = this.value;
  const fill = document.getElementById('strength-fill');
  const label = document.getElementById('strength-label');
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const configs = [
    { w: '0%',   bg: '#e2e8f0', text: '' },
    { w: '25%',  bg: '#dc2626', text: 'Weak' },
    { w: '50%',  bg: '#f59e0b', text: 'Fair' },
    { w: '75%',  bg: '#3b82f6', text: 'Good' },
    { w: '100%', bg: '#16a34a', text: 'Strong' },
  ];
  fill.style.width = configs[score].w;
  fill.style.background = configs[score].bg;
  label.textContent = configs[score].text;
  label.style.color = configs[score].bg;
});
</script>
</body>
</html>
